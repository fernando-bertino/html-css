<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>doc</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form method="post">
        <!-- <p>
            <label for="iano">Em que ano você nasceu? </label>
            <input type="number" name="ano" id="iano" min="1900" max="2026"
            oninput="iidade.innerHTML = Number(2026) - Number(iano.value)">
        </p> -->
        <p>
            <label for="iano">Em que ano você nasceu? </label>
            <input type="number" name="ano" id="iano" min="1900" max="2026"
            oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">Sua idade é: </label>
            <output id="iidade"></output>
        </p>

        <fieldset>
            <legend>Botoes</legend>
                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>

        </fieldset>
    </form>

    <script>
        function calcIdade() {
            let anoAtual = new Date().getFullYear()
            iidade.innerHTML = Number(anoAtual) - Number(iano.value)
        }
    </script>
</body>
</html>
