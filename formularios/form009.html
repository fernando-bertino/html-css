<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>doc</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form method="post">


        <p>
            <label for="inum">Valor</label>
            <input type="range" name="val" id="inum" min="0" max="10" value=5 oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">5</output>
        </p>

        <fieldset>
            <legend>Botoes</legend>
                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>

        </fieldset>
    </form>
</body>
</html>
